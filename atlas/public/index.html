<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Atlas</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04101A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atlas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mulish:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<link rel="modulepreload" href="avatares3d/three/three.module.min.js">
<link rel="modulepreload" href="avatares3d/three/three.core.min.js">
<link rel="modulepreload" href="avatares3d/avatar3d.js">
</head>
<body>
<div class="hud" id="hud" data-vista="cargando">
  <header class="barra">
    <span class="marca"><b>Atlas</b><small>Bóveda BiPlot</small></span>
    <span class="conexion" id="conexion"><i></i><span id="conexion-texto">Conectando…</span></span>
    <button class="icono-boton" id="abrir-ajustes" type="button" aria-label="Ajustes" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main class="escena">
    <section class="centro" aria-label="Atlas">
      <div class="orbita" id="orbita">
        <span class="aro"></span><span class="aro a2"></span><span class="aro a3"></span>
        <div class="atlas" id="atlas"></div>
        <button class="tocar" id="tocar" type="button" hidden>Toca a Atlas para despertarlo</button>
      </div>
      <p class="estado" id="estado" aria-live="polite"></p>
      <div class="onda" id="onda" aria-hidden="true"></div>
      <form class="entrar" id="entrar" hidden>
        <h1>Atlas</h1>
        <p>Tu asistente sobre la Bóveda BiPlot.</p>
        <label class="oculto" for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
        <p class="aviso" id="aviso-entrar" role="alert"></p>
      </form>
    </section>
    <div class="lecturas" id="lecturas">
      <section class="resumen" id="resumen" aria-label="Resumen del día" hidden></section>
      <section class="charla" id="charla" aria-label="Conversación"></section>
    </div>
  </main>

  <footer class="mando" id="mando" hidden>
    <div class="dicho" id="dicho-caja"><span class="quien" id="quien"></span><span class="dicho-texto" id="dicho"></span></div>
    <button class="mic" id="mic" type="button" aria-label="Hablarle a Atlas" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </button>
    <form class="escribir" id="escribir">
      <label class="oculto" for="entrada">Escríbele a Atlas</label>
      <input id="entrada" autocomplete="off" enterkeyhint="send" placeholder="Escríbele a Atlas…" maxlength="2000">
      <button type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
    </form>
  </footer>
</div>

<dialog class="hoja" id="ajustes" aria-labelledby="t-ajustes">
  <form method="dialog">
    <header><h2 id="t-ajustes">Ajustes</h2><button class="icono-boton" value="cerrar" aria-label="Cerrar">✕</button></header>
    <div class="ajuste" role="group" aria-label="Estilo">
      <span>Estilo<small>Cuánto se mueve Atlas</small></span>
      <div class="interruptor"><button type="button" data-ajuste="estilo" data-valor="1">Expresivo</button><button type="button" data-ajuste="estilo" data-valor="0.5">Sobrio</button></div>
    </div>
    <div class="ajuste" role="group" aria-label="Sonidos">
      <span>Sonidos<small>Al despertar, encontrar, guardar…</small></span>
      <div class="interruptor"><button type="button" data-ajuste="sonido" data-valor="si">Sí</button><button type="button" data-ajuste="sonido" data-valor="no">No</button></div>
    </div>
    <div class="ajuste" role="group" aria-label="Voz de Atlas">
      <span>Voz de Atlas<small>Que te lea las respuestas</small></span>
      <div class="interruptor"><button type="button" data-ajuste="voz" data-valor="si">Sí</button><button type="button" data-ajuste="voz" data-valor="no">No</button></div>
    </div>
    <label class="ajuste" for="elegir-voz"><span>Qué voz<small>Las voces en español de este aparato</small></span><select id="elegir-voz"></select></label>
    <p class="gasto" id="gasto"></p>
    <footer><button type="button" class="salir" id="salir">Salir</button></footer>
  </form>
</dialog>

<dialog class="hoja visor" id="visor" aria-labelledby="t-visor">
  <header><h2 id="t-visor"></h2><a class="obsidian" id="visor-obsidian" href="#">Abrir en Obsidian</a><button class="icono-boton" id="cerrar-visor" type="button" aria-label="Cerrar">✕</button></header>
  <article class="md" id="visor-texto"></article>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
